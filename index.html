<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Созвездие Тебя — Лев</title>
<style>
  @font-face {
    font-family: 'Five Minutes';
    src: url('assets/Five_Minutes.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Beryozki';
    src: url('assets/Beryozki.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Second Option';
    src: url('assets/second_option.ttf') format('truetype');
    font-display: swap;
  }
  :root {
    --night: #05060f;
    --nebula: #0c1030;
    --star: #F4F6FF;
    --glow-blue: #7C9CFF;
    --glow-violet: #C9A6FF;
    --gold: #F3D98B;
    --muted: #F4F6FF;
    --faint: #F4F6FF;
    --serif: 'Second Option', Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: 'Second Option', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --header-font: 'Second Option', Georgia, serif;
  }
  button, input, select, textarea { font-family: inherit; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse 120% 80% at 50% 15%, var(--nebula) 0%, var(--night) 55%, #020208 100%);
    color: var(--star);
    font-family: var(--sans);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .bg-stars {
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 30% 65%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 65% 80%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 50% 30%, rgba(255,255,255,0.3), transparent);
    background-repeat: repeat;
    background-size: 400px 400px;
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  header {
    text-align: center;
    padding: 48px 16px 8px;
  }
  header .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  header h1 {
    font-family: var(--header-font);
    font-weight: 400;
    font-size: clamp(24px, 6vw, 36px);
    letter-spacing: 0.5px;
    margin: 0 0 14px;
    background: linear-gradient(120deg, #ffffff, #d7e0ff 45%, #f0d9ff 70%, #ffffff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    font-size: 20px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--muted);
    max-width: 640px;
    margin: 0 auto;
  }

  .progress {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    margin-top: 10px;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .progress-track {
    width: 120px;
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 22px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--glow-blue), var(--glow-violet));
    transition: width 0.6s ease;
  }


  .constellation-holder {
    position: relative;
    aspect-ratio: 1000 / 620;
    width: 100%;
  }
  .lion-line-img, .lion-glow-img {
    position: absolute;
    top: 0;
    left: 11.7%;
    width: 76.6%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
  }
  .lion-line-img {
    opacity: 0.5;
    z-index: 1;
  }
  .lion-glow-img {
    opacity: 0.35;
    z-index: 0;
    filter: blur(1px);
  }
  svg#sky {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
  }

  .line {
    stroke: rgba(200, 210, 255, 0.22);
    stroke-width: 1;
    fill: none;
    stroke-dasharray: 6 4;
    animation: dash-drift 60s linear infinite;
  }
  @keyframes dash-drift {
    to { stroke-dashoffset: -1000; }
  }

  .star-hit {
    cursor: pointer;
    touch-action: manipulation;
  }
  /* soft radial bloom behind every star, replaces the old flat-blurred circle.
     pointer-events:none is required here — this shape is wider than the
     dedicated invisible hit-circle, and without this it was stealing taps
     meant for closely-spaced neighboring stars. */
  .star-halo {
    opacity: 0.6;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .star-hit.discovered .star-halo {
    fill: url(#glowGoldBright);
    opacity: 1;
  }
  .pulse {
    animation: pulse-anim 3.2s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes pulse-anim {
    0%, 100% { opacity: 0.5; r: var(--base-r, 10); }
    50% { opacity: 0.9; r: calc(var(--base-r, 10) * 1.3); }
  }
  .origin-pulse {
    animation: origin-pulse-anim 2.4s ease-in-out infinite;
  }
  @keyframes origin-pulse-anim {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* the four-point sparkle glyph itself, sits on top of the bloom. It
     shimmers by animating width/height/x/y (real SVG geometry properties,
     recentered on the star's own fixed coordinates via calc()) rather than
     CSS transform: scale — transform-origin on an SVG <use> is unreliable
     across browsers and previously made stars drift off their spot. Never
     switch this back to a transform-based animation without testing on
     actual iOS Safari. pointer-events:none so it can't steal taps meant
     for a neighboring star. */
  .star-core {
    transition: fill 0.4s ease;
    animation: twinkle-dim 3.4s ease-in-out infinite;
    pointer-events: none;
  }
  .star-hit.discovered .star-core {
    fill: var(--gold);
    animation: twinkle-bright 2.4s ease-in-out infinite;
  }
  @keyframes twinkle-dim {
    0%, 100% {
      width: calc(var(--core-size) * 0.7); height: calc(var(--core-size) * 0.7);
      x: calc(var(--star-cx) - var(--core-size) * 0.35); y: calc(var(--star-cy) - var(--core-size) * 0.35);
      opacity: 0.4;
    }
    50% {
      width: var(--core-size); height: var(--core-size);
      x: calc(var(--star-cx) - var(--core-size) * 0.5); y: calc(var(--star-cy) - var(--core-size) * 0.5);
      opacity: 1;
    }
  }
  @keyframes twinkle-bright {
    0%, 100% {
      width: var(--core-size); height: var(--core-size);
      x: calc(var(--star-cx) - var(--core-size) * 0.5); y: calc(var(--star-cy) - var(--core-size) * 0.5);
      opacity: 0.85;
    }
    50% {
      width: calc(var(--core-size) * 1.25); height: calc(var(--core-size) * 1.25);
      x: calc(var(--star-cx) - var(--core-size) * 0.625); y: calc(var(--star-cy) - var(--core-size) * 0.625);
      opacity: 1;
    }
  }

  /* crossed light rays, invisible until a star is unlocked. pointer-events:
     none — these reach up to ~5x the star's radius and were overlapping
     neighboring stars' tap targets even while invisible at rest. */
  .star-rays {
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .star-rays path { fill: url(#rayGrad); }
  .star-hit.discovered .star-rays {
    animation: ray-shimmer 5s ease-in-out infinite;
  }
  @keyframes ray-shimmer {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* the "cool unlock" moment: a bright center pop + an expanding ring
     shockwave, both driven by the SVG r/opacity properties (safe —
     no transform-origin involved) so they can't drift off-center. */
  .unlock-flash {
    fill: #fff;
    opacity: 0;
    pointer-events: none;
  }
  .star-hit.discovered .unlock-flash {
    animation: unlock-pop 0.5s ease-out 1;
  }
  @keyframes unlock-pop {
    0% { opacity: 0.95; r: calc(var(--flash-r, 6) * 0.4); }
    100% { opacity: 0; r: calc(var(--flash-r, 6) * 3.2); }
  }
  .unlock-ring {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.4;
    opacity: 0;
    pointer-events: none;
  }
  .star-hit.discovered .unlock-ring {
    animation: unlock-ring-anim 0.85s cubic-bezier(0.2, 0.7, 0.3, 1) 1;
  }
  @keyframes unlock-ring-anim {
    0% { opacity: 0.9; r: calc(var(--flash-r, 6) * 1); stroke-width: 2.2; }
    100% { opacity: 0; r: calc(var(--flash-r, 6) * 6.5); stroke-width: 0.2; }
  }

  /* stardust: mix of tiny sparkle glyphs + fine glitter dots, spawned on
     unlock, kept close so it visibly belongs to its own star. Drift/twinkle
     stays opacity + cx/cy driven only (see .star-core note above). */
  .dust-mote { opacity: 0; pointer-events: none; }
  .dust-mote.dust-dot {
    fill: var(--gold);
    filter: drop-shadow(0 0 2px rgba(243, 217, 139, 0.9));
    animation: dust-appear 0.9s ease forwards, dust-drift 4.5s ease-in-out infinite;
  }
  .dust-mote.dust-glyph {
    fill: #fff9e6;
    filter: drop-shadow(0 0 3px rgba(243, 217, 139, 0.85));
    animation: dust-appear 0.9s ease forwards, glyph-twinkle 3s ease-in-out infinite;
  }
  @keyframes dust-appear {
    to { opacity: var(--mote-peak, 0.9); }
  }
  @keyframes dust-drift {
    0%, 100% { cx: var(--mote-cx); cy: var(--mote-cy); opacity: calc(var(--mote-peak, 0.9) * 0.5); }
    50% { cx: calc(var(--mote-cx) + var(--mote-dx)); cy: calc(var(--mote-cy) + var(--mote-dy)); opacity: var(--mote-peak, 0.9); }
  }
  @keyframes glyph-twinkle {
    0%, 100% { opacity: calc(var(--mote-peak, 0.9) * 0.35); }
    50% { opacity: var(--mote-peak, 0.9); }
  }

  .star-label {
    font-family: 'Second Option', var(--sans);
    font-size: 17px;
    font-weight: 500;
    fill: #F4F6FF;
    letter-spacing: 1px;
    text-transform: uppercase;
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(5,6,15,0.65);
    stroke-width: 2px;
  }

  footer.hint {
    text-align: center;
    margin-top: 26px;
    font-size: 24px;
    font-weight: 500;
    color: var(--faint);
    letter-spacing: 1px;
  }

  /* ---------- Onboarding ---------- */
  .onboarding {
    position: fixed; inset: 0;
    z-index: 50;
    background: radial-gradient(ellipse 120% 80% at 50% 15%, var(--nebula) 0%, var(--night) 55%, #020208 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  .onboarding.closed {
    opacity: 0;
    pointer-events: none;
  }
  .onboarding-card {
    max-width: 440px;
    text-align: center;
  }
  .onboarding-text {
    font-size: 22px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--star);
    margin: 0 0 28px;
    transition: opacity 0.25s ease;
  }
  .onboarding-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 26px;
  }
  .onboarding-dots .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(244,246,255,0.25);
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .onboarding-dots .dot.active {
    background: var(--gold);
    transform: scale(1.3);
  }
  .onboarding-next {
    padding: 14px 32px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: var(--star);
    font-family: var(--sans);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .onboarding-next:active { background: rgba(255,255,255,0.12); }

  /* ---------- Celebration (shown once all 20 are discovered) ---------- */
  .celebration {
    position: fixed; inset: 0;
    z-index: 60;
    background: radial-gradient(ellipse 120% 80% at 50% 15%, var(--nebula) 0%, var(--night) 55%, #020208 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .celebration.open {
    opacity: 1;
    pointer-events: auto;
  }
  .celebration-card {
    max-width: 420px;
    text-align: center;
  }
  .celebration-image {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .celebration-title {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 600;
    color: var(--gold);
    margin: 0 0 28px;
  }
  .celebration-close {
    padding: 14px 32px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: var(--star);
    font-family: var(--sans);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .celebration-close:active { background: rgba(255,255,255,0.12); }

  /* ---------- Reveal Sheet ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(2,2,8,0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: linear-gradient(180deg, #12163a 0%, #090b1e 100%);
    border: 1px solid rgba(255,255,255,0.08);
    border-bottom: none;
    border-radius: 24px 24px 0 0;
    padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 11;
    box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .sheet.open { transform: translateY(0); pointer-events: auto; }

  @media (min-width: 640px) {
    .sheet {
      left: 50%; right: auto; top: 50%; bottom: auto;
      width: 380px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      border-radius: 24px;
      transform: translate(-50%, -50%) scale(0.96);
      opacity: 0;
    }
    .sheet.open { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  .sheet-kicker {
    font-size: 31px;
    font-weight: 500;
    letter-spacing: 0.3px;
    line-height: 1.4;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .viewer-slot {
    width: 100%;
    aspect-ratio: 1 / 0.85;
    border-radius: 18px;
    background:
      radial-gradient(circle at 50% 40%, rgba(124,156,255,0.18), transparent 60%),
      linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .sheet-media {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .sheet-value {
    font-family: var(--serif);
    font-size: 27px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 24px;
  }
  /* the decorative Beryozki font doesn't render Latin script cleanly —
     used for the rare value that's mostly Latin characters */
  .sheet-value.latin-fallback {
    font-family: Georgia, 'Times New Roman', serif;
  }

  .sheet-next {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: var(--star);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .sheet-next:active { background: rgba(255,255,255,0.09); }

  .audio-toggle {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: 18px;
    z-index: 12;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--star);
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .audio-toggle.visible { display: flex; opacity: 1; }

  .start-hint {
    pointer-events: none;
    animation: hint-breathe 2.4s ease-in-out infinite;
  }
  .start-hint text {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 700;
    fill: var(--gold);
  }
  .start-hint path {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.25;
    stroke-linecap: round;
  }
  .start-hint.dismissed {
    animation: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  @keyframes hint-breathe {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="onboarding" id="onboarding">
  <div class="onboarding-card">
    <p class="onboarding-text" id="onboardingText"></p>
    <div class="onboarding-dots" id="onboardingDots">
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <button class="onboarding-next" id="onboardingNext"></button>
  </div>
</div>

<div class="bg-stars"></div>
<button class="audio-toggle" id="audioToggle" aria-label="Включить или выключить звук">♪</button>

<div class="wrap">
  <header>
    <div class="eyebrow">23 августа</div>
    <h1>Ты — наше любимое созвездие</h1>
    <p>В этот день родилась самая прекрасная, самая умная, самая красивая и изящная, глубокая и элегантная, самая сильная, заботливая и любимая нами мама💖</p>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress">
      <span id="progressLabel">0 / 20 открыто</span>
    </div>

<script>
// ---------------------------------------------------------------
// ONBOARDING
// ---------------------------------------------------------------
const ONBOARDING_STEPS = [
  "Как Лев, раскинувшийся в северном полушарии неба между Раком и Девой, состоит из тысяч звёзд, так и в тебе заключено множество красивых и таких разных частичек…",
  "Чтобы помочь тебе увидеть их, мы создали небольшую карту тебя. Каждая звезда в ней хранит одну из твоих граней — открой их одну за другой 🌟",
];
let onboardingStep = 0;
const onboarding = document.getElementById('onboarding');
const onboardingText = document.getElementById('onboardingText');
const onboardingNext = document.getElementById('onboardingNext');
const onboardingDots = document.querySelectorAll('#onboardingDots .dot');

function renderOnboardingStep() {
  onboardingText.textContent = ONBOARDING_STEPS[onboardingStep];
  onboardingDots.forEach((dot, i) => dot.classList.toggle('active', i === onboardingStep));
  onboardingNext.textContent = onboardingStep === ONBOARDING_STEPS.length - 1 ? 'Начать →' : 'Далее →';
}
renderOnboardingStep();

onboardingNext.addEventListener('click', () => {
  if (onboardingStep < ONBOARDING_STEPS.length - 1) {
    onboardingText.style.opacity = 0;
    setTimeout(() => {
      onboardingStep++;
      renderOnboardingStep();
      onboardingText.style.opacity = 1;
    }, 250);
  } else {
    onboarding.classList.add('closed');
  }
});

// Traces tail → back → mane/head cluster, with branches down to all four legs
const LINES = [
  [1,13],[13,16],[16,5],[5,11],[11,19],[19,12],       // tail, rump, hind leg
  [16,15],[15,3],[3,2],                                 // back line
  [2,20],[20,10],                                       // front leg
  [2,9],[9,18],[18,4],                                   // chest / belly
  [2,17],[17,6],[6,7],[6,14],[14,8],[17,8]              // head / mane cluster
];

const discovered = new Set();
const dustSpawned = new Set();
const svg = document.getElementById('sky');
const NS = 'http://www.w3.org/2000/svg';

function spawnStardust(cp) {
  if (dustSpawned.has(cp.id)) return;
  dustSpawned.add(cp.id);

  // fine glitter dots that drift slowly around the star, kept close so
  // the cluster clearly reads as belonging to this star
  const DOT_COUNT = 6;
  for (let i = 0; i < DOT_COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 10 + Math.random() * 14;
    const mx = cp.x + Math.cos(angle) * dist;
    const my = cp.y + Math.sin(angle) * dist;

    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', mx);
    dot.setAttribute('cy', my);
    dot.setAttribute('r', (1.6 + Math.random() * 1.8).toFixed(2));
    dot.setAttribute('class', 'dust-mote dust-dot');
    dot.style.setProperty('--mote-cx', mx);
    dot.style.setProperty('--mote-cy', my);
    dot.style.setProperty('--mote-dx', (Math.random() * 5 - 2.5).toFixed(1));
    dot.style.setProperty('--mote-dy', (Math.random() * 5 - 2.5).toFixed(1));
    dot.style.setProperty('--mote-peak', (0.55 + Math.random() * 0.35).toFixed(2));
    dot.style.animationDelay = `0s, -${(Math.random() * 5).toFixed(2)}s`;
    dot.style.animationDuration = `0.9s, ${(3.5 + Math.random() * 2.5).toFixed(2)}s`;
    svg.appendChild(dot);
  }

  // a few small sparkle glints just outside the dot ring
  const GLYPH_COUNT = 3;
  for (let i = 0; i < GLYPH_COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 16 + Math.random() * 16;
    const size = 3.5 + Math.random() * 3;
    const mx = cp.x + Math.cos(angle) * dist;
    const my = cp.y + Math.sin(angle) * dist;

    const glyph = document.createElementNS(NS, 'use');
    glyph.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#sparkleGlyph');
    glyph.setAttribute('href', '#sparkleGlyph');
    glyph.setAttribute('x', mx - size / 2);
    glyph.setAttribute('y', my - size / 2);
    glyph.setAttribute('width', size);
    glyph.setAttribute('height', size);
    glyph.setAttribute('class', 'dust-mote dust-glyph');
    glyph.style.setProperty('--mote-peak', (0.6 + Math.random() * 0.35).toFixed(2));
    glyph.style.animationDelay = `0s, -${(Math.random() * 3).toFixed(2)}s`;
    glyph.style.animationDuration = `0.9s, ${(2.2 + Math.random() * 1.8).toFixed(2)}s`;
    svg.appendChild(glyph);
  }
}

function byId(id) { return CHECKPOINTS.find(c => c.id === id); }

// Draw connecting lines
LINES.forEach(([a, b]) => {
  const A = byId(a), B = byId(b);
  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', A.x); line.setAttribute('y1', A.y);
  line.setAttribute('x2', B.x); line.setAttribute('y2', B.y);
  line.setAttribute('class', 'line');
  svg.appendChild(line);
});

// Draw stars
CHECKPOINTS.forEach(cp => {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'star-hit');
  g.setAttribute('data-id', cp.id);
  g.style.cursor = 'pointer';

  const isOrigin = cp.special === 'origin';
  const baseR = isOrigin ? 9 : 6;
  const glowUrl = isOrigin ? 'url(#glowGold)' : (cp.id % 2 === 0 ? 'url(#glowBlue)' : 'url(#glowViolet)');

  // invisible larger hit area for touch
  const hit = document.createElementNS(NS, 'circle');
  hit.setAttribute('cx', cp.x); hit.setAttribute('cy', cp.y);
  hit.setAttribute('r', 32);
  hit.setAttribute('fill', 'transparent');
  g.appendChild(hit);

  // soft radial bloom
  const halo = document.createElementNS(NS, 'circle');
  halo.setAttribute('cx', cp.x); halo.setAttribute('cy', cp.y);
  halo.setAttribute('r', baseR * 3.4);
  halo.setAttribute('fill', glowUrl);
  halo.setAttribute('class', 'star-halo ' + (isOrigin ? 'origin-pulse' : 'pulse'));
  halo.style.setProperty('--base-r', baseR * 3.4);
  halo.style.animationDelay = `-${(Math.random() * 3.2).toFixed(2)}s`;
  halo.style.animationDuration = `${(2.6 + Math.random() * 1.4).toFixed(2)}s`;
  g.appendChild(halo);

  // crossed light rays, revealed on unlock
  const rays = document.createElementNS(NS, 'g');
  rays.setAttribute('class', 'star-rays');
  const rayLen = baseR * 5.2, rayWidth = baseR * 0.4;
  [0, 90].forEach(deg => {
    const ray = document.createElementNS(NS, 'path');
    ray.setAttribute('d',
      `M ${cp.x} ${cp.y - rayLen} L ${cp.x + rayWidth} ${cp.y} L ${cp.x} ${cp.y + rayLen} L ${cp.x - rayWidth} ${cp.y} Z`);
    ray.setAttribute('transform', `rotate(${deg} ${cp.x} ${cp.y})`);
    rays.appendChild(ray);
  });
  g.appendChild(rays);

  // four-point sparkle glyph — the star itself
  const core = document.createElementNS(NS, 'use');
  core.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#sparkleGlyph');
  core.setAttribute('href', '#sparkleGlyph');
  core.setAttribute('x', cp.x - baseR * 1.3); core.setAttribute('y', cp.y - baseR * 1.3);
  core.setAttribute('width', baseR * 2.6); core.setAttribute('height', baseR * 2.6);
  core.setAttribute('fill', isOrigin ? 'var(--gold)' : 'var(--star)');
  core.setAttribute('class', 'star-core');
  core.style.setProperty('--star-cx', cp.x);
  core.style.setProperty('--star-cy', cp.y);
  core.style.setProperty('--core-size', baseR * 2.6);
  core.style.animationDelay = `-${(Math.random() * 3.4).toFixed(2)}s`;
  core.style.animationDuration = `${(2.2 + Math.random() * 1.6).toFixed(2)}s`;
  g.appendChild(core);

  // one-shot flash + expanding ring the instant this star is unlocked
  const flash = document.createElementNS(NS, 'circle');
  flash.setAttribute('cx', cp.x); flash.setAttribute('cy', cp.y);
  flash.setAttribute('r', baseR);
  flash.setAttribute('class', 'unlock-flash');
  flash.style.setProperty('--flash-r', baseR);
  g.appendChild(flash);

  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('cx', cp.x); ring.setAttribute('cy', cp.y);
  ring.setAttribute('r', baseR);
  ring.setAttribute('class', 'unlock-ring');
  ring.style.setProperty('--flash-r', baseR);
  g.appendChild(ring);

  // label — most categories are a single line; a few long two-word names
  // wrap onto two shorter lines instead of one wide one (labelLines)
  const label = document.createElementNS(NS, 'text');
  const labelX = cp.x + (cp.labelDx || 0);
  const baseY = Math.max(cp.y - baseR - 18, 22) + (cp.labelDy || 0);
  label.setAttribute('x', labelX);
  label.setAttribute('text-anchor', 'middle');
  label.setAttribute('class', 'star-label');
  if (cp.labelLines) {
    const lineHeight = 23;
    const topY = baseY - (cp.labelLines.length - 1) * lineHeight;
    cp.labelLines.forEach((line, i) => {
      const tspan = document.createElementNS(NS, 'tspan');
      tspan.setAttribute('x', labelX);
      tspan.setAttribute('y', topY + i * lineHeight);
      tspan.textContent = line;
      label.appendChild(tspan);
    });
  } else {
    label.setAttribute('y', baseY);
    label.textContent = cp.category;
  }
  g.appendChild(label);

  g.addEventListener('click', () => openCheckpoint(cp.id));
  svg.appendChild(g);
});

// Safety net: once the real label font has finished loading (metrics can
// shift from the fallback font), nudge any label whose measured width would
// spill past the canvas edges back into bounds. Long category names like
// "Направление в искусстве" would otherwise clip off the right side.
document.fonts.ready.then(() => {
  const MARGIN = 10;
  document.querySelectorAll('.star-label').forEach(label => {
    const box = label.getBBox();
    let dx = 0;
    if (box.x < MARGIN) dx = MARGIN - box.x;
    else if (box.x + box.width > 1000 - MARGIN) dx = (1000 - MARGIN) - (box.x + box.width);
    if (!dx) return;
    // two-line labels position each line via its own tspan x, which
    // ignores the parent <text> element's x — nudge those individually
    const tspans = label.querySelectorAll('tspan');
    if (tspans.length) {
      tspans.forEach(t => t.setAttribute('x', parseFloat(t.getAttribute('x')) + dx));
    } else {
      label.setAttribute('x', parseFloat(label.getAttribute('x')) + dx);
    }
  });
});

// "Start here!" scribble pointing at the origin star, dismissed once it's unlocked
const originStar = CHECKPOINTS.find(c => c.special === 'origin');
if (originStar) {
  const hint = document.createElementNS(NS, 'g');
  hint.setAttribute('class', 'start-hint');
  hint.setAttribute('id', 'startHint');

  // Text sits down-and-left of the star. The arrow approaches diagonally
  // from the lower-left, with a clear gap from the star's halo on one end
  // and a clear gap from the text on the other.
  const approach = { x: -0.676, y: 0.737 }; // unit vector, star -> text direction
  const gapStar = 55;   // distance from star center to arrow tip
  const arrowLen = 55;  // visible length of the arrow line
  const gapText = 20;   // gap between arrow tail and top of the text

  const arrowEnd = { x: originStar.x + approach.x * gapStar, y: originStar.y + approach.y * gapStar };
  const arrowStart = { x: originStar.x + approach.x * (gapStar + arrowLen), y: originStar.y + approach.y * (gapStar + arrowLen) };
  const tx = arrowStart.x - 40, ty = arrowStart.y + gapText + 27; // +27 ~ font ascender

  const arrow = document.createElementNS(NS, 'path');
  arrow.setAttribute('d',
    `M ${arrowStart.x} ${arrowStart.y} Q ${arrowStart.x + 14} ${arrowStart.y - 20}, ${arrowEnd.x} ${arrowEnd.y}`);
  arrow.setAttribute('marker-end', 'url(#startArrowhead)');
  hint.appendChild(arrow);

  const label = document.createElementNS(NS, 'text');
  label.setAttribute('x', tx);
  label.setAttribute('y', ty);
  label.setAttribute('transform', `rotate(-4 ${tx} ${ty})`);
  label.textContent = 'Начни здесь!';
  hint.appendChild(label);

  svg.appendChild(hint);
}

// ---------------------------------------------------------------
// Reveal sheet logic
// ---------------------------------------------------------------
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const sheetKicker = document.getElementById('sheetKicker');
const sheetValue = document.getElementById('sheetValue');
const sheetImg = document.getElementById('sheetImg');
const sheetVideo = document.getElementById('sheetVideo');
const sheetNext = document.getElementById('sheetNext');

function showSheetMedia(media) {
  if (media.type === 'video') {
    sheetImg.style.display = 'none';
    sheetImg.removeAttribute('src');
    sheetVideo.src = media.src;
    sheetVideo.style.display = 'block';
    sheetVideo.play().catch(() => {});
  } else {
    sheetVideo.pause();
    sheetVideo.style.display = 'none';
    sheetVideo.removeAttribute('src');
    sheetImg.src = media.src;
    sheetImg.style.display = 'block';
  }
}
const progressLabel = document.getElementById('progressLabel');
const progressFill = document.getElementById('progressFill');
const audioToggle = document.getElementById('audioToggle');

const bgAudio = document.getElementById('bgAudio');
const SONG_START_SECONDS = 33; // 0:33
let audioStarted = false;
let audioPlaying = false;
bgAudio.volume = 0.6; // 40% quieter than full volume

const sfxAudio = document.getElementById('sfxAudio');
function playSfx() {
  // Pause before rewinding rather than seeking mid-playback — seeking a
  // still-playing element is a known source of dropped/aborted play()
  // calls on Safari when stars are tapped in quick succession.
  sfxAudio.pause();
  sfxAudio.currentTime = 0;
  sfxAudio.play().catch(err => console.warn('SFX playback blocked', err));
}

function startSong() {
  if (audioStarted) return;
  audioStarted = true;

  // Setting currentTime before play() only reliably "sticks" on iOS Safari
  // once metadata is loaded — so we wait for it if needed.
  const seekAndPlay = () => {
    try { bgAudio.currentTime = SONG_START_SECONDS; } catch (e) { /* not seekable yet */ }
    const p = bgAudio.play();
    if (p && p.catch) {
      p.then(() => {
        audioPlaying = true;
        audioToggle.classList.add('visible');
        audioToggle.textContent = '♪';
      }).catch(err => {
        console.warn('Playback blocked', err);
      });
    }
  };

  if (bgAudio.readyState >= 1) {
    seekAndPlay();
  } else {
    bgAudio.addEventListener('loadedmetadata', seekAndPlay, { once: true });
    bgAudio.load();
  }
}

audioToggle.addEventListener('click', () => {
  if (!audioStarted) return;
  audioPlaying = !audioPlaying;
  if (audioPlaying) {
    bgAudio.play();
    audioToggle.textContent = '♪';
  } else {
    bgAudio.pause();
    audioToggle.textContent = '✕';
  }
});

function updateProgress() {
  progressLabel.textContent = discovered.size + ' / 20 открыто';
  progressFill.style.width = (discovered.size / 20 * 100) + '%';
}

function openCheckpoint(id) {
  const cp = byId(id);
  discovered.add(id);
  document.querySelector(`.star-hit[data-id="${id}"]`).classList.add('discovered');
  playSfx();
  spawnStardust(cp);
  updateProgress();

  sheetKicker.textContent = cp.desc;
  sheetValue.textContent = cp.value;
  sheetValue.classList.toggle('latin-fallback', !!cp.latinValue);
  showSheetMedia(cp.media);

  overlay.classList.add('open');
  sheet.classList.add('open');

  if (cp.special === 'origin') {
    startSong();
    const hint = document.getElementById('startHint');
    if (hint) hint.classList.add('dismissed');
  }
}

let celebrationShown = false;
const celebration = document.getElementById('celebration');
const celebrationClose = document.getElementById('celebrationClose');
const finalSound = document.getElementById('finalSound');

function closeSheet() {
  overlay.classList.remove('open');
  sheet.classList.remove('open');
  sheetVideo.pause();
  if (discovered.size === CHECKPOINTS.length && !celebrationShown) {
    celebrationShown = true;
    setTimeout(() => {
      celebration.classList.add('open');
      finalSound.currentTime = 0;
      finalSound.play().catch(err => console.warn('Final sound blocked', err));
    }, 2000);
  }
}

overlay.addEventListener('click', closeSheet);
sheetNext.addEventListener('click', closeSheet);
celebrationClose.addEventListener('click', () => celebration.classList.remove('open'));
</script>
